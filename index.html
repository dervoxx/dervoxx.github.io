<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <title>Aleksander Mliczek</title>
</head>
<body>
<div class="container">
    <div id="mliczek-logo" class="logo" aria-label="Mliczek logo"></div>

    <!-- Name Text -->
    <h1>
        <span class="tracking-in-contract-bck-top">Aleksander</span>
        <span class="tracking-in-contract-bck-bottom">Mliczek</span>
    </h1>

    <div class="links">
        <a href="https://github.com/dervoxx/" class="github-link">GitHub</a>
        <span class="dot">·</span>

</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.12.2/lottie.min.js"></script>
<script>
    lottie.loadAnimation({
        container: document.getElementById('mliczek-logo'),
        renderer: 'svg',
        loop: false,
        autoplay: true,
        path: 'mliczek-lottie/logo-lottie.json'
    });
</script>

</html>
